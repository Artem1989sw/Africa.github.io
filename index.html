<style>
:root {
  --sand: #E7DCC2;
  --sand-deep: #DCCEA9;
  --card: #F6EFDD;
  --ink: #2A2318;
  --ink-soft: #5A503E;
  --indigo: #1F2A44;
  --indigo-deep: #141B2C;
  --indigo-line: #3A4A6B;
  --rust: #A8432B;
  --rust-soft: #C9714F;
  --gold: #B98A2E;
  --line: rgba(42, 35, 24, .14);
  --shadow: 0 2px 10px rgba(42, 35, 24, .07);
  --font-serif: 'Bitter', Georgia, 'Times New Roman', serif;
  --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

* {

}

html,
body {
  margin: 0;
  padding: 0
}

body {
  background: var(--sand);
  color: var(--ink);
  font-family: Manrope, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased
}

h1,
h2,
h3,
h4 {
  font-family: Bitter, serif;
  margin: 0;
  color: var(--ink);
  letter-spacing: -.01em
}

p {
  margin: 0 0 1em
}

a {
  color: inherit
}

::selection {
  background: var(--rust);
  color: #fff
}

.app {
  display: flex;
  min-height: 100vh
}

.sidebar {
  width: 264px;
  flex-shrink: 0;
  background: var(--indigo-deep);
  color: #e9e4d6;
  padding: 34px 22px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto
}

.brand {
  font-family: Bitter, serif;
  font-weight: 800;
  font-size: 1.5rem;
  line-height: 1.15;
  color: #f3eedd;
  margin-bottom: 6px
}

.brand-sub {
  font-size: .8rem;
  color: #8e97ac;
  margin-bottom: 30px;
  line-height: 1.5
}

.nav-search-wrap {
  position: relative;
  margin-bottom: 14px;
}

.nav-search-input {
  width: 100%;
  background: #ffffff0d;
  border: 1px solid #ffffff1c;
  border-radius: 8px;
  padding: 9px 32px 9px 12px;
  color: #f3eedd;
  font-family: Manrope, sans-serif;
  font-size: .85rem;
  outline: none;
  transition: border-color .15s ease;
}

.nav-search-input::placeholder {
  color: #6e778e;
}

.nav-search-input:focus {
  border-color: #ffffff40;
}

.nav-search-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #8e97ac;
  cursor: pointer;
  font-size: .8rem;
  padding: 6px;
  display: none;
}

.nav-search-clear:hover {

}

.nav-search-empty {

  padding: 10px 4px 16px;
  line-height: 1.5;
}

.nav-search-tag {
  font-size: .6rem;
  color: #6e778e;
  text-transform: uppercase;
  letter-spacing: .04em;
  flex-shrink: 0;
  margin-left: auto;
  padding-left: 8px;
}

.nav-group-label {
  font-size: .72rem;
  color: #6e778e;
  margin: 22px 0 8px 4px
}

.nav-tabs {
  display: flex;
  gap: 4px;
  background: #ffffff0d;
  border-radius: 9px;
  padding: 3px;
  margin-bottom: 18px
}

.nav-tab {

.nav-tab:hover {

}

.nav-tab.active {

  color: #f3eedd
}

.nav-tab-panel {
  display: none
}

.nav-tab-panel.active {
  display: block
}

.nav-subgroup-label {

  color: #6e778e;
  margin: 16px 0 6px 4px;
  text-transform: uppercase;
  letter-spacing: .04em
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  background: none;
  border: none;
  text-align: left;
  color: #c7ccda;
  font-family: Manrope, sans-serif;
  font-size: .94rem;
  font-weight: 600;
  padding: 10px;
  border-radius: 7px;
  cursor: pointer;
  margin-bottom: 2px;
  transition: background .15s ease, color .15s ease
}

.nav-item:hover {
  background: #ffffff0f;
  color: #fff
}

.nav-item.active {
  background: #ffffff1c;
  color: #fff
}

.flag-chip {

  height: 14px;

}

.nav-item .cname {

  color: #5c6479;
  padding: 10px 10px 4px;
  line-height: 1.6;
  border-top: 1px solid rgba(255, 255, 255, .08);
  margin-top: 16px
}

.theme-accordion-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  background: none;
  border: none;
  color: #8e97ac;
  font-family: Manrope, sans-serif;
  font-size: .82rem;
  font-weight: 700;
  padding: 9px 10px;
  cursor: pointer;
  border-radius: 7px;
  transition: background .15s ease, color .15s ease
}

.theme-accordion-btn:hover {
  background: #ffffff0f;
  color: #fff
}

.theme-accordion-btn .chev {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
  transition: transform .18s ease
}

.theme-accordion-btn.open .chev {
  transform: rotate(180deg)
}

.theme-more {
  max-height: 0;
  overflow: hidden;
  transition: max-height .22s ease
}

.theme-more.open {
  max-height: 700px
}

.anchor-nav {
  display: flex;
  gap: 4px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 10px 56px;
  position: sticky;
  top: 0;
  z-index: 20;
  overflow-x: auto
}

.anchor-nav button {
  background: none;
  border: none;
  font-family: Manrope, sans-serif;
  font-weight: 700;
  font-size: .86rem;
  color: var(--ink-soft);
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s ease, color .15s ease
}

.anchor-nav button:hover {
  background: var(--sand);
  color: var(--ink)
}

.mobile-topbar,
.sidebar-backdrop {
  display: none
}

body.sidebar-locked {
  overflow: hidden
}

.main {
  flex: 1;
  min-width: 0
}

.page {
  display: none
}

.page.active {
  display: block
}

.hero {
  background: var(--indigo-deep);
  color: #efeada;
  padding: 64px 56px 52px;
  position: relative;
  overflow: hidden
}

.hero .flagbar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 8px
}

.hero.hero-country .flagbar {
  width: 14px
}

.hero-flagbar-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px
}

.hero-eyebrow {
  color: #8e97ac;
  font-size: .9rem;
  margin-bottom: 14px
}

.hero h1 {
  font-size: 3.1rem;
  font-weight: 800;
  color: #fbf7ea;
  max-width: 820px
}

.hero-lede {
  max-width: 640px;
  color: #b9c0d0;
  font-size: 1.08rem;
  margin-top: 16px
}

.factstrip {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  margin-top: 34px;
  border-top: 1px solid rgba(255, 255, 255, .14);
  padding-top: 22px
}

.fact {
  padding: 0 30px 0 0;
  margin-right: 30px;
  border-right: 1px solid rgba(255, 255, 255, .14)
}

.fact:last-child {
  border-right: none
}

.fact-label {
  font-size: .78rem;
  color: #8e97ac;
  margin-bottom: 4px
}

.fact-value {
  font-family: Bitter, serif;
  font-weight: 700;
  font-size: 1.15rem;
  color: #f3eedd
}

.section {
  padding: 52px 56px;
  max-width: 920px
}

.section-title {
  font-size: 1.7rem;
  font-weight: 700;
  margin-bottom: 20px;
  color: var(--indigo)
}

.section p {
  color: var(--ink)
}

.section p+p {
  margin-top: 0
}

.deckwrap {
  background: var(--sand);
  padding: 0 56px 56px
}

.deck-label {
  font-size: .95rem;
  color: var(--ink-soft);
  margin-bottom: 14px;
  max-width: 920px
}

.deck {
  max-width: 820px;
  background: var(--indigo);
  border-radius: 10px;
  color: #f3eedd;
  padding: 0;
  position: relative;
  box-shadow: 0 10px 30px #141b2c40
}

.deck-inner {
  padding: 46px 52px 40px;
  min-height: 230px;
  display: flex;
  flex-direction: column;
  justify-content: center
}

.deck-count {
  font-family: Bitter, serif;
  font-size: .85rem;
  color: var(--rust-soft);
  font-weight: 700;
  margin-bottom: 14px;
  letter-spacing: .02em
}

.deck-title {
  font-size: 1.5rem;
  font-weight: 700;
  color: #fbf7ea;
  margin-bottom: 12px
}

.deck-text {
  color: #c7ccda;
  font-size: 1rem;
  max-width: 640px
}

.deck-stat {
  display: inline-block;
  margin-top: 16px;
  background: #ffffff14;
  border: 1px solid rgba(255, 255, 255, .16);
  padding: 8px 14px;
  border-radius: 6px;
  font-family: Bitter, serif;
  font-weight: 700;
  color: var(--rust-soft);
  font-size: .95rem
}

.deck-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 22px;
  border-top: 1px solid rgba(255, 255, 255, .12)
}

.deck-btn {
  background: none;
  border: 1px solid rgba(255, 255, 255, .25);
  color: #e9e4d6;
  font-family: Manrope, sans-serif;
  font-weight: 600;
  font-size: .88rem;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  transition: background .15s ease
}

.deck-btn:hover {
  background: #ffffff1a
}

.deck-btn:disabled {
  opacity: .3;
  cursor: default
}

.deck-dots {
  display: flex;
  gap: 6px
}

.deck-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ffffff40
}

.deck-dot.on {
  background: var(--rust-soft)
}

.timeline {
  max-width: 920px;
  padding: 0 56px 60px
}

.tl-item {
  display: flex;
  gap: 26px;
  padding-bottom: 26px;
  position: relative
}

.tl-item:not(:last-child):before {
  content: "";
  position: absolute;
  left: 57px;
  top: 26px;
  bottom: -4px;
  width: 1px;
  background: var(--line)
}

.tl-year {
  width: 78px;
  flex-shrink: 0;
  font-family: Bitter, serif;
  font-weight: 700;
  color: var(--rust);
  font-size: .98rem;
  padding-top: 2px;
  text-align: right
}

.tl-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--rust);
  margin-top: 6px;
  flex-shrink: 0;
  box-shadow: 0 0 0 4px var(--sand)
}

.tl-body h4 {
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 5px;
  color: var(--indigo)
}

.tl-body p {
  color: var(--ink-soft);
  font-size: .96rem;
  max-width: 660px
}

.footnote {
  padding: 24px 56px 60px;
  max-width: 920px;
  color: var(--ink-soft);
  font-size: .85rem;
  border-top: 1px solid var(--line);
  margin: 0 56px 40px
}

.mapwrap {
  padding: 0 56px 20px;
  max-width: 920px
}

.map-frame {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px 20px 8px
}

.map-svg {
  width: 100%;
  height: auto;
  display: block
}

.map-country {
  stroke: var(--indigo);
  stroke-width: 1.5;
  cursor: pointer;
  transition: opacity .15s ease
}

.map-country:hover {
  opacity: .85
}

.map-country-label {
  font-family: Bitter, serif;
  font-weight: 700;
  fill: var(--indigo-deep);
  font-size: 17px;
  pointer-events: none
}

.map-neighbor-label {
  font-family: Manrope, sans-serif;
  fill: #9c927a;
  font-size: 11px;
  pointer-events: none
}

.map-capital-dot {
  fill: var(--indigo-deep);
  stroke: #fff;
  stroke-width: 1.5
}

.map-capital-label {
  font-family: Manrope, sans-serif;
  font-weight: 700;
  fill: var(--ink);
  font-size: 12px;
  pointer-events: none
}

.map-event-dot {
  fill: var(--rust);
  stroke: #fff;
  stroke-width: 1.3
}

.map-event-label {
  font-family: Manrope, sans-serif;
  fill: var(--rust);
  font-size: 10.5px;
  font-weight: 600;
  pointer-events: none
}

.map-base-marker {
  fill: none;
  stroke: var(--ink-soft);
  stroke-width: 1.4;
  stroke-dasharray: 2.5 2.5
}

.map-base-label {
  font-family: Manrope, sans-serif;
  fill: var(--ink-soft);
  font-size: 10.5px;
  pointer-events: none
}

.map-zone {
  fill: var(--rust);
  opacity: .16
}

.maplegend {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  padding: 14px 4px 16px;
  font-size: .82rem;
  color: var(--ink-soft)
}

.maplegend .li {
  display: flex;
  align-items: center;
  gap: 7px
}

.maplegend .swatch {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  border-radius: 50%
}

.maplegend .swatch.sq {
  border-radius: 2px
}

.maplegend .swatch.dash {
  background: none;
  border: 1.4px dashed var(--ink-soft);
  box-sizing: border-box
}

.maplegend .swatch.zone {
  background: var(--rust);
  opacity: .35;
  border-radius: 2px
}

.map-caption {
  font-size: .85rem;
  color: var(--ink-soft);
  margin: 6px 0 0
}

.sources-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 0 56px 60px;
  max-width: 920px
}

.source-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 20px;
  flex-wrap: wrap
}

.source-name {
  font-family: Bitter, serif;
  font-weight: 700;
  color: var(--indigo);
  font-size: 1rem
}

.source-name a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px dashed var(--indigo-line);
}

.source-name a:hover {
  color: var(--rust);
  border-bottom-color: var(--rust);
}

.source-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px
}

.sources-note {
  padding: 0 56px 8px;
  max-width: 920px;
  color: var(--ink-soft);
  font-size: .95rem
}

.glossary-list {
  display: flex;
  flex-direction: column;
  padding: 0 56px 60px;
  max-width: 920px
}

.gloss-item {
  padding: 18px 0;
  border-bottom: 1px solid var(--line)
}

.gloss-item:last-child {
  border-bottom: none
}

.gloss-term {
  font-family: Bitter, serif;
  font-weight: 800;
  color: var(--indigo);
  font-size: 1.08rem;
  margin-bottom: 6px
}

.gloss-def {
  color: var(--ink);
  font-size: .95rem;
  max-width: 720px;
  margin: 0
}

.timeline-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 56px 26px;
  max-width: 920px;
  align-items: center
}

.tf-btn {
  font-family: Manrope, sans-serif;
  font-weight: 700;
  font-size: .82rem;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  cursor: pointer;
  transition: opacity .15s ease, border-color .15s ease
}

.tf-btn.off {
  opacity: .4
}

.tf-reset {
  font-size: .82rem;
  color: var(--ink-soft);
  text-decoration: underline;
  cursor: pointer;
  background: none;
  border: none;
  padding: 7px 4px;
  font-family: Manrope, sans-serif
}

.tl-badge {
  display: inline-block;
  font-size: .7rem;
  font-weight: 700;
  color: #fff;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: .01em;
  margin-bottom: 8px
}

.country-cards {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  padding: 0 56px 60px;
  max-width: 920px
}

.ccard {
  flex: 1 1 240px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 22px 22px 24px;
  cursor: pointer;
  transition: border-color .15s ease, transform .15s ease
}

.ccard:hover {
  border-color: var(--rust);
  transform: translateY(-2px)
}

.ccard .flagbar-h {
  height: 5px;
  border-radius: 3px;
  margin-bottom: 16px;
  width: 44px
}

.ccard h3 {
  font-size: 1.2rem;
  margin-bottom: 8px
}

.ccard p {
  font-size: .9rem;
  color: var(--ink-soft);
  margin: 0
}

.theme-icon {
  width: 44px;
  height: 44px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  box-shadow: 0 3px 8px #2a23182e
}

.theme-icon svg {
  width: 23px;
  height: 23px;
  color: #f9f5e8
}

.comparewrap {
  padding: 0 56px 44px;
  max-width: 920px
}

.compare-scroll {
  overflow-x: auto;
  border-radius: 10px;
  border: 1px solid var(--line)
}

.compare-table {
  width: 100%;
  min-width: 640px;
  border-collapse: collapse;
  background: var(--card)
}

.compare-table th,
.compare-table td {
  padding: 14px 18px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--line)
}

.compare-table thead th {
  background: var(--indigo-deep);
  color: #f3eedd;
  font-family: Bitter, serif;
  font-weight: 700;
  font-size: 1rem;
  white-space: nowrap
}

.compare-table thead th:first-child {
  background: var(--indigo-deep)
}

.compare-table thead th .flag-chip {
  margin-right: 8px;
  vertical-align: -2px
}

.compare-table td.compare-label {
  font-family: Bitter, serif;
  font-weight: 700;
  color: var(--indigo);
  font-size: .9rem;
  white-space: nowrap;
  background: #2a231809
}

.compare-table td {
  color: var(--ink-soft);
  font-size: .9rem;
  line-height: 1.55;
  max-width: 280px
}

.compare-table tbody tr:last-child td {
  border-bottom: none
}

.compare-note {
  font-size: .85rem;
  color: var(--ink-soft);
  margin: 12px 0 0
}

.cmp-short {
  font-weight: 600;

.pcard-role {

.pcard-dates {

.pcard-tags {

.pcard-tag {

.pcard-more {

.pcard-more.open {

.pcard-toggle {

.pcard-link {

.notebox {

.notebox h4 {

.notebox p {

@media(max-width:860px) {
  .app {

/* ==========================================================================
   ГЕОПОЛІТИЧНИЙ ДАШБОРД (GEOPOLITICAL DASHBOARD)
   ========================================================================== */
.dash-container {
  padding: 24px 32px 48px;
  background: var(--sand);
  max-width: 1400px;
  margin: 0 auto;
}

.dash-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 14px;
}

.dash-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-sans);
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--ink-soft);
  background: rgba(42, 35, 24, 0.05);
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--line);
}

.dash-status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #239E46;
  box-shadow: 0 0 0 3px rgba(35, 158, 70, 0.25);
  animation: dash-dot-pulse 2s infinite ease-in-out;
}

@keyframes dash-dot-pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(35, 158, 70, 0.5); }
  70% { transform: scale(1.15); box-shadow: 0 0 0 6px rgba(35, 158, 70, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(35, 158, 70, 0); }
}

.dash-title-wrap {
  text-align: center;
}

.dash-title {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--indigo-deep);
  letter-spacing: -0.01em;
  margin: 0;
}

.dash-subtitle {
  font-family: var(--font-sans);
  font-size: 0.78rem;
  color: var(--ink-soft);
  margin-top: 2px;
  font-weight: 600;
}

.dash-user-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-sans);
  font-size: 0.84rem;
  color: var(--ink-soft);
  font-weight: 700;
}

.dash-user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--indigo), var(--rust));
  color: #f3eedd;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 0.86rem;
  font-weight: 800;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

/* Map Card */
.dash-map-card {
  background: #FCFAF6;
  border: 1px solid var(--line);
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 6px 24px rgba(31, 42, 68, 0.08);
  margin-bottom: 22px;
}

.dash-map-viewport {
  position: relative;
  width: 100%;
  height: 560px;
  background: #F7F3E9;
  overflow: hidden;
}

.dash-map-svg {
  width: 100%;
  height: 100%;
  display: block;
  transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
  cursor: grab;
}

.dash-map-svg:active {
  cursor: grabbing;
}

/* Map Controls */
.dash-map-controls {
  position: absolute;
  top: 16px;
  left: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 15;
}

.dash-ctrl-btn {
  width: 34px;
  height: 34px;
  background: #ffffffeb;
  border: 1px solid var(--line);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
  font-weight: 800;
  font-size: 1.15rem;
  color: var(--indigo);
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  transition: all 0.15s ease;
  user-select: none;
}

.dash-ctrl-btn:hover {
  background: #fff;
  border-color: var(--rust);
  color: var(--rust);
  transform: translateY(-1px);
}

/* Map Header Tools */
.dash-map-header-tools {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  z-index: 15;
}

.dash-layer-select-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #ffffffeb;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 14px;
  font-family: var(--font-sans);
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--indigo);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  transition: all 0.15s;
}

.dash-layer-select-btn:hover {
  background: #fff;
  border-color: var(--indigo);
}

.dash-layer-dropdown {
  position: absolute;
  top: 42px;
  right: 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 0;
  box-shadow: 0 8px 24px rgba(20, 27, 44, 0.16);
  min-width: 220px;
  display: none;
  z-index: 25;
}

.dash-layer-dropdown.open {
  display: block;
}

.dash-layer-opt {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  font-family: var(--font-sans);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.12s;
}

.dash-layer-opt:hover {
  background: var(--card);
}

.dash-layer-opt.active {
  color: var(--rust);
  font-weight: 800;
  background: rgba(168, 67, 43, 0.08);
}

.dash-map-legend-card {
  background: #ffffffeb;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 14px;
  font-family: var(--font-sans);
  font-size: 0.74rem;
  display: flex;
  flex-direction: column;
  gap: 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.dash-legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ink-soft);
  font-weight: 600;
}

.dash-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ================= AFRICA CONTINENT & SAHEL MAP STYLING ================= */
.dash-quick-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.dash-qfilter-chip {
  background: #ffffffeb;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 4px 10px;
  font-family: var(--font-sans);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--ink-soft);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s ease;
  user-select: none;
}

.dash-qfilter-chip:hover {
  border-color: var(--indigo);
  color: var(--indigo);
}

.dash-qfilter-chip.active {
  background: var(--indigo);
  border-color: var(--indigo);
  color: #fff;
}

.dash-qfilter-chip.active.f-base { background: #1F2A44; }
.dash-qfilter-chip.active.f-jihad { background: #A8432B; }
.dash-qfilter-chip.active.f-res { background: #B98A2E; }
.dash-qfilter-chip.active.f-coast { background: #2E8B7D; }
.dash-qfilter-chip.active.f-routes { background: #5A1F1A; }

/* Africa Map Paths */
.africa-country {
  fill: #D9D0C1;
  stroke: #B5A895;
  stroke-width: 0.8;
  cursor: pointer;
  transition: fill 0.2s ease, opacity 0.2s ease, stroke 0.2s ease, stroke-width 0.2s ease;
}

.africa-country:hover {
  fill: #CFC4B2;
  opacity: 0.95;
  stroke: var(--indigo);
  stroke-width: 1.5;
}

.africa-country[tabindex]:focus-visible,
.geo-country[tabindex]:focus-visible {
  outline: 3px solid var(--rust);
  outline-offset: 1px;
}

/* Zone 1: AES / Sahel (Mali, Burkina Faso, Niger) -> Terracotta / Rust #A8432B */
.africa-country.zone-1, .geo-country.zone-1 {
  fill: #A8432B !important;
  stroke: #7B2A17 !important;
  stroke-width: 1.5 !important;
}

.africa-country.zone-1:hover, .geo-country.zone-1:hover {
  fill: #BF4D32 !important;
  stroke: #4F190D !important;
}

/* Zone 2: Transit & Influence (Libya, Chad, Sudan, CAR) -> Deep Indigo #1F2A44 */
.africa-country.zone-2, .geo-country.zone-2 {
  fill: #1F2A44 !important;
  stroke: #101726 !important;
  stroke-width: 1.5 !important;
}

.africa-country.zone-2:hover, .geo-country.zone-2:hover {
  fill: #2C3C61 !important;
  stroke: #0A0F1A !important;
}

/* Coastal Threat Countries (Benin, Togo, Cote d'Ivoire) */
.africa-country.zone-coast {
  fill: #D2DDD6 !important;
  stroke: #2E8B7D !important;
  stroke-width: 1.2 !important;
}

/* Labels on Continent Map */
.africa-label-zone1 {
  font-family: var(--font-serif);
  font-weight: 800;
  font-size: 13px;
  fill: #FAF4E8;
  pointer-events: none;
  filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.5));
}

.africa-label-zone2 {
  font-family: var(--font-serif);
  font-weight: 800;
  font-size: 13px;
  fill: #FAF4E8;
  pointer-events: none;
  filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.5));
}

.africa-label-neutral {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 10px;
  fill: #7D7360;
  pointer-events: none;
}

/* Year Badge on Map */
.dash-map-year-badge {
  position: absolute;
  bottom: 16px;
  left: 16px;
  background: var(--indigo-deep);
  color: #FAF4E8;
  padding: 6px 14px;
  border-radius: 8px;
  font-family: var(--font-serif);
  font-size: 1.1rem;
  font-weight: 800;
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 10;
}

.dash-year-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--rust-soft);
  box-shadow: 0 0 6px var(--rust);
}

/* Logistics Corridors Styling */
.route-sea {
  stroke: #0077B6;
  stroke-width: 2.4;
  stroke-dasharray: 6 4;
  fill: none;
  animation: dash-flow 12s linear infinite;
}

.route-land {
  stroke: #E05206;
  stroke-width: 2.2;
  stroke-dasharray: 5 4;
  fill: none;
  animation: dash-flow 14s linear infinite;
}

.route-air {
  stroke: #9D4EDD;
  stroke-width: 1.8;
  stroke-dasharray: 3 4;
  fill: none;
  animation: dash-flow 10s linear infinite;
}

.route-weapons {
  stroke: #A8432B;
  stroke-width: 2.2;
  stroke-dasharray: 4 3;
  fill: none;
  animation: dash-flow 11s linear infinite;
}

/* Map Country Styling */
.geo-water {
  fill: #E2ECEF;
}

.geo-grid-line {
  stroke: #DDD4C0;
  stroke-dasharray: 4 5;
  stroke-width: 0.8;
}

.geo-grid-text {
  font-family: var(--font-sans);
  font-size: 9.5px;
  fill: #A89C86;
  font-weight: 600;
  pointer-events: none;
}

.geo-country {
  stroke: #7D6B53;
  stroke-width: 1.3;
  transition: fill 0.2s ease, opacity 0.2s ease, stroke 0.2s ease;
  cursor: pointer;
}

.geo-country:hover {
  opacity: 0.9;
  stroke: var(--indigo-deep);
  stroke-width: 2.2;
}

.geo-neighbor {
  fill: #EAE5D9;
  stroke: #BFB6A4;
  stroke-width: 1;
  cursor: default;
}

.geo-neighbor:hover {
  opacity: 1;
}

.geo-country.aes-mali { fill: #EBD6BD; }
.geo-country.aes-burkina { fill: #E5CAB8; }
.geo-country.aes-niger { fill: #EFE0C7; }
.geo-country.geo-libya { fill: #EBE5DB; }
.geo-country.geo-chad { fill: #DFE8DB; }
.geo-country.geo-sudan { fill: #EBD7D2; }
.geo-country.geo-car { fill: #E4DCEB; }

.geo-country-label {
  font-family: var(--font-serif);
  font-weight: 800;
  font-size: 13.5px;
  letter-spacing: 0.02em;
  fill: var(--indigo-deep);
  pointer-events: none;
}

.geo-neighbor-label {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 11px;
  fill: #918671;
  pointer-events: none;
}

.geo-capital-dot {
  fill: #ffffff;
  stroke: var(--indigo-deep);
  stroke-width: 1.4;
  pointer-events: none;
}

.geo-capital-label {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 9px;
  letter-spacing: 0.01em;
  fill: #ffffff;
  paint-order: stroke;
  stroke: rgba(20, 27, 44, 0.55);
  stroke-width: 2.5px;
  stroke-linejoin: round;
  pointer-events: none;
}

/* Hotspot Halos */
.geo-halo {
  opacity: 0.42;
  mix-blend-mode: multiply;
  pointer-events: none;
  animation: halo-pulse 3.5s ease-in-out infinite alternate;
}

@keyframes halo-pulse {
  0% { transform: scale(0.95); opacity: 0.32; }
  100% { transform: scale(1.05); opacity: 0.52; }
}

/* Map Interactive Pins - Stable No-Jitter Hover */
.dash-pin {
  cursor: pointer;
}

.dash-pin-hit {
  fill: transparent;
  cursor: pointer;
  pointer-events: all;
}

.dash-pin-pulse {
  pointer-events: none;
  animation: pin-pulse-ring 2.2s infinite ease-out;
  transform-origin: center;
}

.dash-pin-core {
  transition: r 0.18s cubic-bezier(0.2, 0.8, 0.4, 1), stroke-width 0.18s ease, filter 0.18s ease;
  pointer-events: none;
}

.dash-pin:hover .dash-pin-core {
  r: 8.5;
  stroke-width: 2.4;
  filter: drop-shadow(0px 3px 8px rgba(0,0,0,0.5));
}

@keyframes pin-pulse-ring {
  0% { r: 5; opacity: 0.8; stroke-width: 1.5; }
  75% { r: 16; opacity: 0; stroke-width: 0.5; }
  100% { r: 16; opacity: 0; stroke-width: 0; }
}

/* Transit routes */
.dash-route-line {
  stroke-dasharray: 6 5;
  animation: dash-flow 15s linear infinite;
}

@keyframes dash-flow {
  to { stroke-dashoffset: -100; }
}

/* Tooltip on Map */
.dash-map-tooltip {
  position: absolute;
  z-index: 40;
  background: var(--indigo-deep);
  color: #F8F4EB;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  padding: 16px 18px;
  max-width: 340px;
  box-shadow: 0 12px 34px rgba(20, 27, 44, 0.5);
  display: none;
  animation: tooltipIn 0.18s ease-out;
}

@keyframes tooltipIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.dash-tt-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.dash-tt-tag {
  font-family: var(--font-sans);
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  letter-spacing: 0.04em;
  color: #fff;
}

.dash-tt-close {
  background: none;
  border: none;
  color: #9BA4B7;
  font-size: 1.3rem;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  transition: color 0.12s;
}

.dash-tt-close:hover {
  color: #fff;
}

.dash-tt-title {
  font-family: var(--font-serif);
  font-weight: 800;
  font-size: 1.08rem;
  color: #FAF5E8;
  margin-bottom: 4px;
}

.dash-tt-meta {
  font-family: var(--font-sans);
  font-size: 0.74rem;

<p>Наратив про Сахель легко звужується до дуелі «росія проти Заходу» з українським епізодом як несподіваним доповненням. Але поки «Африканський корпус» охороняє палаци, а Слов'янський корпус і «Вагнер» лишили по собі гучну хроніку боїв, Китай роками методично заходить у регіон через геологорозвідку, кредити на інфраструктуру й — дедалі частіше — контракти на озброєння. Ця присутність не претендує на газетні заголовки, але за грошовим обсягом вона в багатьох епізодах переважає й російську, й західну.</p>
</div>

<div class="section">
<h2 class="section-title">Літій замість золота: Ganfeng у Малі</h2>
<p>Родовище Гуламіна на півдні Малі, за 350 з гаком кілометрів від Бамако, — одне з найбільших у світі нерозроблених родовищ твердопородного літію. У грудні 2024 року найбільший китайський виробник літію Ganfeng Lithium запустив там першу чергу видобутку потужністю близько 506 тисяч тонн літієвої руди на рік, з наміром згодом подвоїти обсяг. Цей самий проєкт уже згадувався в розділі «Гроші й ресурси» серед нових угод, які малійська хунта уклала за оновленим гірничим кодексом восени 2025 року, — разом з Allied Gold, B2Gold і Resolute Mining, але саме з більшою державною часткою участі.</p>
<p>На відміну від золота, за контроль над яким Малі торгувалося із західними компаніями роками, з Ganfeng угода пройшла швидко й без публічних конфліктів — Пекін традиційно не висуває умов щодо прозорості чи прав людини, а натомість пропонує капітал і швидке будівництво.</p>
</div>

<div class="section">
<h2 class="section-title">Нафта в обхід моря: Нігер і труба CNPC</h2>
<p>Ще з 2012 року China National Petroleum Corporation намагалася побудувати експортний маршрут для нафти з родовища Агадем у пустельному Нігері — країна не має виходу до моря, тож усю видобуту нафту доводилося переробляти на місці, на побудованому тим самим CNPC заводі в Зіндері. У травні 2024 року майже дворічну будову — трубопровід довжиною понад 1900 км вартістю $4,5–7 млрд (за різними оцінками) — нарешті запустили: перший танкер забрав мільйон барелів нігерської нафти з порту Кутону в сусідньому Беніні.</p>
<p>Проєкт одразу показав, наскільки крихкою є інфраструктура в регіоні: вже в серпні 2024-го Нігер тимчасово перекрив прокачування через дипломатичний конфлікт із Беніном (хунта звинуватила Котону в тому, що той дав притулок французьким військам після їхнього виведення з Нігеру). Постачання відновили за кілька тижнів, але епізод показав: навіть суто економічний, ніби-то нейтральний китайський проєкт не застрахований від політичних струсів хунт, які будують зовнішню політику на образах і підозрах.</p>
</div>

<div class="section">
<h2 class="section-title">Зброя без ідеологічних умов</h2>
<p>Найпомітніший зсув останніх двох років — не в надрах, а на полігонах. У 2024 році Буркіна-Фасо, найлояльніша до росії країна регіону, отримала партію китайської бронетехніки: бойові машини вогневої підтримки CS/VN9 (по суті, колісний танк), мінно-захищені CS/VP14, самохідні міномети PLL-05 і реактивні системи залпового вогню SR5 — по суті, китайський аналог американських HIMARS. У лютому 2026 року аналогічні поставки — бронетехніку, засоби протиповітряної оборони й РСЗВ — зафіксували вже й у Малі.</p>
<p>За оцінками аналітиків оборонного видання Defense Express, це не випадковість, а системний тренд: Китай поступово витісняє росію з традиційних для неї ринків озброєнь у регіоні — не лише в Малі й Буркіна-Фасо, а й у сусідньому Алжирі, де досі домінувала російська техніка на кшталт Т-90. Пояснення просте: Пекін пропонує конкурентну ціну, стабільні поставки незалежно від санкцій — і, як і з видобувними контрактами, жодних запитань про те, як саме техніка буде застосована.</p>
<div class="notebox">
<h4>Чому Китай і росія тут не конкурують напряму</h4>
<p>Попри те, що обидві держави нарощують присутність в одних і тих самих країнах, це радше паралельні, ніж конкурентні історії. росія продає хунтам безпеку режиму — особисту охорону лідерів, навчання армії, бойові операції проти повстанців. Китай продає інфраструктуру, капітал і дедалі частіше техніку, але уникає власне бойової присутності на землі. Для військових урядів Сахелю це зручний поділ праці: росія купує лояльність зброєю й тілами інструкторів, Китай — грошима, які не вимагають ідеологічної відданості. У підсумку хунти отримують і те, і те, не мусячи обирати між покровителями.</p>
</div>
</div>

<h2 class="section-title">Хронологія</h2>

`
}

function handleNavSearch(query) {
  const clearBtn = document.getElementById("navSearchClear"),
    resultsEl = document.getElementById("navSearchResults"),
    browseEl = document.getElementById("navBrowseView");
  query = query.trim();
  clearBtn.style.display = query ? "block" : "none";
  if (!query) { resultsEl.innerHTML = ""; browseEl.style.display = ""; return; }
  browseEl.style.display = "none";
  const q = query.toLowerCase(),
    seen = new Set(),
    matches = SEARCH_INDEX.filter(s => {
      if (!s.name.toLowerCase().includes(q)) return false;
      const key = s.id + "|" + s.name;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  resultsEl.innerHTML = matches.length ? matches.slice(0, 30).map(m => `
<button class="nav-item" onclick="goTo('${m.id}'); clearNavSearch();">
${flagChip(m.flagKey)}<span class="cname">${m.name}</span><span class="nav-search-tag">${m.tag}</span>
</button>
`).join("") : `<div class="nav-search-empty">Нічого не знайдено за запитом «${query}»</div>`;
}

function clearNavSearch() {
  const input = document.getElementById("navSearchInput");
  input.value = "";
  handleNavSearch("");
}

let dashMapMode = "sahel"; // single, cleaned-up map mode
let dashMapZoom = 1;
let dashActiveLayer = "all";
let dashActiveYearIdx = AFRICA_TIMELINE_YEARS.length - 1;

// Quick Toggle States
let dashToggles = {
  bases: true,
  jihad: true,
  resources: true,
  coast: true,
  routes: true
};

function switchMapMode(mode) {
  dashMapMode = mode;

  const gContinent = document.getElementById("gContinentAfrica");
  const gSahel = document.getElementById("gSahelFocus");
  const svg = document.getElementById("dashMapSvg");

  svg.setAttribute("viewBox", "0 0 1020 580");
  if (gContinent) gContinent.style.display = "none";
  if (gSahel) gSahel.style.display = "inline";

  updatePinPositions();
  updateMapPinsVisibility();
  closeMapTooltip();
}

function toggleQuickFilter(filterKey) {
  dashToggles[filterKey] = !dashToggles[filterKey];
  const btn = document.getElementById(`qf-${filterKey}`);
  if (btn) btn.classList.toggle("active", dashToggles[filterKey]);
  updateMapPinsVisibility();
}

function setMapLayer(layer, label) {
  dashActiveLayer = layer;
  const lbl = document.getElementById("dashLayerLabel");
  if (lbl) lbl.textContent = label;
  document.querySelectorAll(".dash-layer-opt").forEach(el => el.classList.toggle("active", el.dataset.layer === layer));
  const d = document.getElementById("dashLayerDropdown");
  if (d) d.classList.remove("open");
  updateMapPinsVisibility();
}

function toggleLayerDropdown(e) {
  if (e) e.stopPropagation();
  const d = document.getElementById("dashLayerDropdown");
  if (d) d.classList.toggle("open");
}

document.addEventListener("click", () => {
  const d = document.getElementById("dashLayerDropdown");
  if (d) d.classList.remove("open");
});

function updatePinPositions() {
  document.querySelectorAll(".dash-pin").forEach(el => {
    const pinId = el.id.replace("pin-", "");
    const p = DASH_PINS.find(item => item.id === pinId);
    if (p) {
      el.setAttribute("transform", `translate(${p.cx}, ${p.cy})`);
    }
  });
}

function updateMapPinsVisibility() {
  const currentYearData = AFRICA_TIMELINE_YEARS[dashActiveYearIdx];
  const allowedBases = currentYearData.bases || [];
  const allowedClashes = currentYearData.clashes || [];
  const allowedResources = currentYearData.resources || [];
  const activeRoutes = currentYearData.routes || [];

  // 1. Pins visibility
  document.querySelectorAll(".dash-pin").forEach(el => {
    const pinId = el.id.replace("pin-", "");
    const type = el.dataset.type;
    
    let isYearActive = false;
    if (type === "base" && allowedBases.includes(pinId)) isYearActive = true;
    else if (type === "clash" && allowedClashes.includes(pinId)) isYearActive = true;
    else if (type === "resource" && allowedResources.includes(pinId)) isYearActive = true;

    let isFilterActive = false;
    if (type === "base" && dashToggles.bases) isFilterActive = true;
    else if (type === "clash" && dashToggles.jihad) isFilterActive = true;
    else if (type === "resource" && dashToggles.resources) isFilterActive = true;

    let isLayerMatch = false;
    if (dashActiveLayer === "all") isLayerMatch = true;
    else if (dashActiveLayer === "military" && type === "base") isLayerMatch = true;
    else if (dashActiveLayer === "conflicts" && type === "clash") isLayerMatch = true;
    else if (dashActiveLayer === "resources" && type === "resource") isLayerMatch = true;

    el.style.display = (isYearActive && isFilterActive && isLayerMatch) ? "block" : "none";
  });

  // 2. Logistics routes visibility
  document.querySelectorAll(".dash-route-corridor").forEach(el => {
    const routeId = el.dataset.route;
    const isYearActive = activeRoutes.includes(routeId);
    el.style.display = (isYearActive && dashToggles.routes) ? "inline" : "none";
  });

  // 3. Coastal highlight
  document.querySelectorAll(".africa-country.zone-coast").forEach(el => {
    el.style.opacity = dashToggles.coast ? "1" : "0.5";
  });
}

function zoomMap(delta) {
  dashMapZoom = Math.max(1, Math.min(2.5, dashMapZoom + delta));
  applyMapTransform();
}

function resetMapZoom() {
  dashMapZoom = 1;
  applyMapTransform();
  closeMapTooltip();
}

function applyMapTransform() {
  const svg = document.getElementById("dashMapSvg");
  if (svg) {
    svg.style.transform = `scale(${dashMapZoom})`;
    svg.style.transformOrigin = "50% 50%";
  }
}

function showPinTooltip(pinId, event) {
  if (event) event.stopPropagation();
  const pin = DASH_PINS.find(p => p.id === pinId);
  if (!pin) return;

  const tt = document.getElementById("dashMapTooltip");
  if (!tt) return;

  document.getElementById("dashTtTag").textContent = pin.badge;
  document.getElementById("dashTtTag").style.background = pin.badgeBg || "#1F2A44";
  document.getElementById("dashTtTitle").textContent = `${pin.name} (${pin.country})`;
  document.getElementById("dashTtMeta").textContent = pin.date;
  document.getElementById("dashTtDesc").textContent = pin.desc;
  
  const linkBtn = document.getElementById("dashTtBtn");
  linkBtn.textContent = pin.linkLabel;
  linkBtn.onclick = () => { goTo(pin.linkId); };

  const vp = document.getElementById("dashMapViewport");
  const rect = vp.getBoundingClientRect();
  
  const targetX = pin.cx;
  const targetY = pin.cy;

  const vb = { x: 0, y: 0, w: 1020, h: 580 };
  
  const posX = ((targetX - vb.x) / vb.w) * rect.width;
  const posY = ((targetY - vb.y) / vb.h) * rect.height;

  let left = posX - 160;
  let top = posY - 190;
  if (left < 15) left = 15;
  if (left + 330 > rect.width) left = rect.width - 345;
  if (top < 15) top = posY + 20;

  tt.style.left = `${left}px`;
  tt.style.top = `${top}px`;
  tt.style.display = "block";
}

function closeMapTooltip() {
  const tt = document.getElementById("dashMapTooltip");
  if (tt) tt.style.display = "none";
}

function scrubYear(idx) {
  dashActiveYearIdx = idx;
  document.querySelectorAll(".dash-scrub-node").forEach((node, i) => {
    node.classList.toggle("active", i === idx);
  });
  
  const yr = AFRICA_TIMELINE_YEARS[idx];
  const badge = document.getElementById("dashYearBadgeNum");
  if (badge) badge.textContent = yr.year;
  
  const yearDesc = document.getElementById("dashYearDesc");
  if (yearDesc) yearDesc.textContent = yr.summary;
  
  updateMapPinsVisibility();
}

function scrollScrubber(dir) {
  const nextIdx = Math.max(0, Math.min(AFRICA_TIMELINE_YEARS.length - 1, dashActiveYearIdx + dir));
  scrubYear(nextIdx);
}

function initDashboard() {
  switchMapMode(dashMapMode);
  scrubYear(dashActiveYearIdx);
}

<div class="section" id="anchor-about">
<h2 class="section-title">Що таке Сахель</h2>
<p>Сахель — смуга напівпустелі між Сахарою та саванами Західної й Центральної Африки, від Атлантики до Червоного моря. У широкому значенні до нього відносять Мавританію, Сенегал, Малі, Буркіна-Фасо, Нігер, північ Нігерії, Чад, Судан та Еритрею.</p>
<p>Але коли зараз говорять про «кризу Сахелю», йдеться передусім про три країни — <strong>Малі, Буркіна-Фасо й Нігер</strong>. Усі три за 2020–2023 роки пережили військові перевороти, розірвали союз із колишньою метрополією Францією і в тій чи іншій формі запросили російську військову підтримку.</p>
<p>17 вересня 2023 року ці три країни утворили Альянс держав Сахелю — військовий союз на випадок зовнішньої агресії, а 6 липня 2024-го перетворили його на повноцінну Конфедерацію зі спільними політичними й економічними амбіціями, аж до єдиної валюти. Усі три вийшли з регіонального блоку ЕКОВАС.</p>

</div>
<div class="ccard" onclick="goTo('ukraine')">
<div class="theme-icon" style="background:${FLAGS.ukraine}">${ICONS.ukraine}</div>
<h3>Українська лінія</h3>
<p>Заява ГУР про Тінзауатен, розрив дипвідносин Малі й Нігеру з Києвом — і що з цього підтверджено, а що ні.</p>
</div>
<div class="ccard" onclick="goTo('china')">
<div class="theme-icon" style="background:${FLAGS.china}">${ICONS.china}</div>
<h3>Китай: третій гравець</h3>
<p>Літій Ganfeng у Малі, нафтопровід CNPC в Нігері й китайська зброя в Буркіна-Фасо — історія складніша, ніж дуель росії й Заходу.</p>
</div>
<div class="ccard" onclick="goTo('infowar')">
<div class="theme-icon" style="background:${FLAGS.infowar}">${ICONS.infowar}</div>
<h3>Інформаційна війна</h3>
<p>Як росія просуває образ Траоре й наратив «повернутого суверенітету» в соцмережах — задокументована кампанія.</p>
</div>
<div class="ccard" onclick="goTo('resources')">
<div class="theme-icon" style="background:${FLAGS.resources}">${ICONS.resources}</div>
<h3>Гроші й ресурси</h3>
<p>Золото Малі й Буркіна-Фасо, уран Нігеру — хто контролює видобуток зараз і куди йдуть потоки.</p>
</div>
<div class="ccard" onclick="goTo('dossier')">
<div class="theme-icon" style="background:${FLAGS.dossier}">${ICONS.dossier}</div>
<h3>Досьє: ключові особи</h3>
<p>Пригожин, Уткін, Гойта, Траоре, Чіані — короткі картки з біографією й роллю в подіях.</p>
</div>
</div>
<div class="footnote">Дані про перевороти, чисельність населення та хронологію подій зібрані з відкритих джерел (Вікіпедія, Reuters, РСМД, регіональні медіа) станом на 2026 рік й будуть уточнюватися.</div>
`;
}
function renderCountry(e) {
  return `
<div class="hero hero-country">
<div class="flagbar" style="background:${FLAGS[e.flagKey]}"></div>
<div class="hero-flagbar-top" style="background:${FLAGS[e.flagKey]}"></div>
<div class="hero-eyebrow">${e.eyebrow || "Альянс держав Сахелю"}</div>
<h1>${e.name}</h1>
<p class="hero-lede">${e.intro[0]}</p>
<div class="factstrip">
<div class="fact"><div class="fact-label">Столиця</div><div class="fact-value">${e.capital}</div></div>
<div class="fact"><div class="fact-label">Населення</div><div class="fact-value">${e.population}</div></div>
<div class="fact"><div class="fact-label">Площа</div><div class="fact-value">${e.area}</div></div>
<div class="fact"><div class="fact-label">Незалежність</div><div class="fact-value">${e.independence}</div></div>
<div class="fact"><div class="fact-label">Мова</div><div class="fact-value">${e.language}</div></div>
</div>
</div>
<div class="section">
<h2 class="section-title">Устрій і як до нього прийшли</h2>
${e.intro.slice(1).map(t=>`<p>${t}</p>`).join("")}
${e.order.map(t=>`<p>${t}</p>`).join("")}
</div>
<div class="deckwrap">
<div class="deck-label">Коротко: ключові моменти</div>
<div class="deck" id="deck-${e.id}"></div>
</div>
<div class="section" style="padding-bottom:0;">
<h2 class="section-title">Присутність росії — хронологія</h2>
</div>
${renderTimeline(e.timeline)}
<div class="footnote">${e.sourceNote || "Останнє оновлення розділу — вересень 2026 року. Джерела: Reuters, BBC, Новая газета Європа, РСМД, відкриті звіти дослідницьких центрів."}</div>
`
}
const deckState = {};

function initDeck(e, t) {
  deckState[e] = 0, drawDeck(e, t)
}

function drawDeck(e, t) {
  const a = deckState[e],
    i = t[a],
    s = document.getElementById("deck-" + e);
  s && (s.innerHTML = `
<div class="deck-inner">
<div class="deck-count">${a+1} / ${t.length}</div>
<div class="deck-title">${i.title}</div>
<div class="deck-text">${i.text}</div>
${i.stat?`<div class="deck-stat">${i.stat}</div>`:""}
</div>
<div class="deck-nav">
<button class="deck-btn" onclick="deckMove('${e}', -1)" ${a===0?"disabled":""}>← Назад</button>
<div class="deck-dots">${t.map((l,c)=>`<span class="deck-dot ${c===a?"on":""}"></span>`).join("")}</div>
<button class="deck-btn" onclick="deckMove('${e}', 1)" ${a===t.length-1?"disabled":""}>Далі →</button>
</div>
`)
}

function deckMove(e, t) {
  let a;
  e === "overview" ? a = OVERVIEW_SLIDES : e === "jihad" ? a = JIHAD_SLIDES : a = (COUNTRIES.find(i => i.id === e) || OTHER_COUNTRIES.find(i => i.id === e)).slides, deckState[e] = Math.max(0, Math.min(a.length - 1, deckState[e] + t)), drawDeck(e, a)
}
const OVERVIEW_SLIDES = PROLOGUE_TIMELINE.map(e => ({
  title: `${e.year} — ${e.title}`,
  text: e.text
}));

const VALID_PAGE_IDS = ["overview", "compare", "jihad", "coast", "ukraine", "dossier", "infowar", "resources", "sources", "timeline", "glossary", "china", "changelog"].concat(COUNTRIES.map(c => c.id), OTHER_COUNTRIES.map(c => c.id));
let suppressHashRender = false;

function goTo(e) {
  if (!VALID_PAGE_IDS.includes(e)) e = "overview";
  if ((location.hash.slice(1) || "overview") === e) {
    renderPage(e);
    return
  }
  suppressHashRender = true;
  location.hash = e;
  renderPage(e)
}

function svgKeyNav(evt, id) {
  if (evt.key === "Enter" || evt.key === " " || evt.key === "Spacebar") {
    evt.preventDefault();
    goTo(id);
  }
}

function renderPage(e) {
  if (!VALID_PAGE_IDS.includes(e)) e = "overview";
  renderNav(e);
  const t = document.getElementById("main");
  if (e === "overview") { t.innerHTML = `<div class="page active">${renderOverview()}</div>`; initDeck("overview", OVERVIEW_SLIDES); initDashboard(); }
  else if (e === "compare") t.innerHTML = `<div class="page active">${renderComparePage()}</div>`;
  else if (e === "jihad") t.innerHTML = `<div class="page active">${renderJihadPage()}</div>`, initDeck("jihad", JIHAD_SLIDES);
  else if (e === "coast") t.innerHTML = `<div class="page active">${renderCoastPage()}</div>`;
  else if (e === "ukraine") t.innerHTML = `<div class="page active">${renderUkrainePage()}</div>`;
  else if (e === "dossier") t.innerHTML = `<div class="page active">${renderDossierPage()}</div>`;
  else if (e === "infowar") t.innerHTML = `<div class="page active">${renderInfowarPage()}</div>`;
  else if (e === "resources") t.innerHTML = `<div class="page active">${renderResourcesPage()}</div>`;
  else if (e === "sources") t.innerHTML = `<div class="page active">${renderSourcesPage()}</div>`;
  else if (e === "timeline") t.innerHTML = `<div class="page active">${renderTimelinePage()}</div>`, updateMasterTimelineUI();
  else if (e === "glossary") t.innerHTML = `<div class="page active">${renderGlossaryPage()}</div>`;
  else if (e === "china") t.innerHTML = `<div class="page active">${renderChinaPage()}</div>`;
  else if (e === "changelog") t.innerHTML = `<div class="page active">${renderChangelogPage()}</div>`;
  else {
    const a = COUNTRIES.find(i => i.id === e) || OTHER_COUNTRIES.find(i => i.id === e);
    t.innerHTML = `<div class="page active">${renderCountry(a)}</div>`, initDeck(a.id, a.slides)
  }
  window.scrollTo(0, 0), closeSidebar()
}

window.addEventListener("hashchange", () => {
  if (suppressHashRender) {
    suppressHashRender = false;
    return
  }
  renderPage(decodeURIComponent(location.hash.slice(1)) || "overview")
});

function openSidebar() {
  document.getElementById("sidebar").classList.add("open"), document.getElementById("sidebarBackdrop").classList.add("open"), document.body.classList.add("sidebar-locked")
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open"), document.getElementById("sidebarBackdrop").classList.remove("open"), document.body.classList.remove("sidebar-locked")
}

function scrollToAnchor(e) {
  const t = document.getElementById(e);
  if (!t) return;
  const a = document.querySelector(".anchor-nav"),
    o = a ? a.offsetHeight : 0,
    i = t.getBoundingClientRect().top + window.scrollY - o - 12;
  window.scrollTo({
    top: i,
    behavior: "smooth"
  })
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.contains("open") ? closeSidebar() : openSidebar()
}
renderPage(decodeURIComponent(location.hash.slice(1)) || "overview");
</script>
</body>
</html>
