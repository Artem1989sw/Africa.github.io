</svg>`},PEOPLE=[{id:"prigozhin",name:"Євген Пригожин",role:"Засновник і фінансист «Вагнера»",dates:"1961–2023",avatarBg:"linear-gradient(135deg,#5A1F1A,#A8432B)",initials:"ЄП",tags:["«Вагнер»","москва"],linkId:"overview",linkLabel:"Хронологія «Вагнера» →",bio:["Петербурзький підприємець із кримінальним минулим, який у 2000-х став постачальником кремлівських структур і отримав прізвисько «кухар путіна». З 2014 року фінансував і публічно очолював приватну військову компанію «Вагнер», хоча роками офіційно заперечував будь-який зв’язок із нею.","Саме через мережу Пригожина «Вагнер» заходив у Африку — від ЦАР і Судану до Лівії й Малі — в обмін на доступ до родовищ золота й алмазів. У червні 2023 року він підняв заколот і повів колону на москву, за кілька тижнів домовившись про виїзд до Білорусі. Через два місяці, у серпні 2023-го, загинув у авіакатастрофі під Тверю разом з Уткіним і ще кількома соратниками — подія, яку більшість спостерігачів пов’язують з помстою Кремля за заколот."]},{id:"utkin",name:"Дмитро Уткін",role:"Командир «Вагнера», позивний «Вагнер»",dates:"1970–2023",avatarBg:"linear-gradient(135deg,#2A2318,#5A503E)",initials:"ДУ",tags:["«Вагнер»","ГРУ"],linkId:"overview",linkLabel:"Хронологія «Вагнера» →",bio:["Колишній офіцер спецназу ГРУ, учасник обох чеченських кампаній. Після служби опинився серед бійців «Слов’янського корпусу» в Сирії 2013 року, а рік по тому очолив нову структуру, яка отримала бойовий позивний свого командира — «Вагнер».","На відміну від Пригожина, Уткін залишався переважно тіньовою фігурою — військовим ядром компанії, тоді як фінансування й публічну частину брав на себе Пригожин. Загинув разом із ним в авіакатастрофі в серпні 2023 року, за два місяці після заколоту."]},{id:"goita",name:"Ассімі Гойта",role:"Президент перехідного періоду Малі",dates:"нар. 1983",avatarBg:"linear-gradient(90deg,#14B53A,#B98A2E)",initials:"АГ",tags:["Малі","Два перевороти"],linkId:"mali",linkLabel:"Розділ про Малі →",bio:["Полковник спецпризначенців, який очолив обидва малійські перевороти — серпень 2020-го проти президента Ібрагіма Бубакара Кейта і травень 2021-го, коли усунув уже власних цивільних союзників по перехідному уряду й одноосібно очолив країну.","Саме за Гойти Малі розірвала союз із Францією й запросила «Вагнер», а згодом стала одним із засновників Альянсу, а потім Конфедерації держав Сахелю. Вибори неодноразово переносили; перехідна хартія 2024 року фактично дала йому право керувати без визначеної дати їх проведення."]},{id:"traore",name:"Ібрагім Траоре",role:"Президент Буркіна-Фасо",dates:"нар. 1988",avatarBg:"linear-gradient(180deg,#EF2B2D,#009E49)",initials:"ІТ",tags:["Буркіна-Фасо","Наймолодший лідер"],linkId:"burkina",linkLabel:"Розділ про Буркіна-Фасо →",bio:["Капітан, який у вересні 2022 року, у 34 роки, скинув іншого путчиста — Поль-Анрі Сандаого Дамібу, — звинувативши того в бездіяльності проти джихадистів і надмірній прив’язаності до Франції. Став наймолодшим на той момент главою держави в Африці.","Свідомо будує публічний образ на паралелях із Тома Санкарою — панафриканським лідером Буркіна-Фасо 1980-х. Правління указами й відкладені вибори (перехідний період продовжено орієнтовно до 2029 року) поєднуються з риторикою про «повернутий суверенітет», яку активно підхоплює й підсилює російська пропаганда."]},{id:"tiani",name:"Абдурахман Чіані",role:"Президент Нігеру",dates:"нар. бл. 1960",avatarBg:"linear-gradient(180deg,#E05206,#0DB02B)",initials:"АЧ",tags:["Нігер","Гвардія"],linkId:"niger",linkLabel:"Розділ про Нігер →",bio:["З 2015 року командував президентською гвардією Нігеру — постом, який AFP свого часу описувало як роль «найтаємничішого» силовика країни. У 2021-му саме його підрозділ зірвав спробу перевороту напередодні інавгурації Мохамеда Базума.","26 липня 2023 року очолив уже власний заколот: гвардія заблокувала й затримала Базума, який відтоді залишається під вартою. Чіані очолив перехідну Національну раду порятунку батьківщини, а в березні 2025 року формально став президентом Нігеру."]}],PROLOGUE_TIMELINE=[{year:"2013",title:"«Слов’янський корпус» у Сирії",text:"Приватна структура, пов’язана з Moran Security Group, відправляє російських бійців охороняти нафтові об’єкти режиму Асада. Загін потрапляє в оточення, зазнає втрат, бійців вивозять з країни зі скандалом — Слідчий комітет росії відкриває справу за найманство."},{year:"2014",title:"Народження «Вагнера»",text:"Частина людей і практик «Слов’янського корпусу» лягає в основу нової структури під командуванням Дмитра Уткіна (позивний «Вагнер»), яку невдовзі починає фінансувати Євген Пригожин."},{year:"2017–2018",title:"Перший захід у Африку",text:"«Вагнер» з’являється в Центральноафриканській Республіці як охорона президента й радники, отримуючи доступ до родовищ золота та алмазів в обмін на військову підтримку. Слідом — Судан і Лівія."},{year:"2021",title:"Малі",text:"Після двох переворотів малійська хунта запрошує «Вагнер» замість французьких військ."},{year:"2023, червень",title:"Заколот Пригожина",text:"Марш «Вагнера» на москву, домовленість про виїзд до Білорусі. За два місяці Пригожин і Уткін гинуть в авіакатастрофі."},{year:"2023–2024",title:"«Африканський корпус»",text:"Міністерство оборони росії формує нову структуру, яка поглинає й перейменовує африканські підрозділи «Вагнера» — тепер це державна, а не приватна сила."}],COUNTRIES=[{id:"mali",name:"Малі",flagKey:"mali",capital:"Бамако",population:"≈ 23 млн (2025)",area:"1 240 000 км²",independence:"1960, від Франції",language:"французька (офіційна), бамбара",compare:{coups:"2 — серпень 2020 і травень 2021 (обидва рази в центрі подій Ассімі Гойта)",corps:"2025 — офіційний перехід від «Вагнера»; підрозділи «Африканського корпусу» фіксують у країні вже з 2023–2024",resources:"Золото — один з провідних виробників у Африці; контроль над видобувною галуззю — головний предмет торгу хунти з партнерами",security:"З вересня 2025-го JNIM тримає паливну блокаду навколо Бамако (спалено 300+ автоцистерн, США й Британія закликали громадян виїхати); у квітні 2026-го джихадисти й туарезькі повстанці взяли Кідаль і одночасно атакували кілька міст",delays:"Вибори лютого 2024-го — обіцяні на 24-місячний перехід — перенесено у вересні 2023-го «з технічних причин»; конкретної дати відтоді не називали, а в липні 2025-го парламент дав Гойті поновлюваний 5-річний мандат узагалі без виборів",parties:"У квітні 2024-го діяльність партій призупиняли на три місяці; 30 квітня 2025-го Рада міністрів ухвалила повну заборону, а 7 травня підписано указ про безстрокове призупинення",opposition:"У травні 2025-го поліція не пустила опозицію на власний з’їзд у Палаці культури Бамако; за даними Human Rights Watch, активістів і критиків викрадають, змушують до вигнання чи затримують"},intro:["Малі — країна, з якої почалася нинішня хвиля військових режимів у Сахелі. Ще з 2012 року північ країни контролювали туарезькі сепаратисти й джихадистські угруповання, а французька армія роками намагалася стримати їх операціями «Сервал» і «Бархан».","Невдоволення армії ходом війни та звинувачення президента Ібрагіма Бубакара Кейта в корупції й фальсифікаціях призвели до перевороту в серпні 2020 року. Дев’ять місяців потому, у травні 2021-го, той самий військовий гурток здійснив другий, внутрішній переворот: полковник Ассімі Гойта, віцепрезидент перехідного уряду, усунув цивільного президента й прем’єра перехідного періоду та очолив країну сам."],order:["Гойта з 2021 року офіційно є «президентом перехідного періоду» — посада, яка мала бути тимчасовою, але вибори неодноразово переносили. У 2024 році ухвалили нову перехідну хартію, яка де-факто дає йому право керувати без чіткої дати виборів.","Діяльність партій уперше призупинили указом у квітні 2024 року на три місяці; остаточну й безстрокову заборону Рада міністрів ухвалила 30 квітня 2025-го, а тиждень по тому парламент дав Гойті поновлюваний 5-річний президентський мандат без потреби в будь-яких виборах. Публічна діяльність опозиції заборонена, незалежні медіа працюють під тиском. Влада тримається на армії, особистій присутності Гойти в інформаційному просторі та наративі про «повернутий суверенітет» — риторику, яку активно підсилює й російська пропаганда."],timeline:[{year:"2020, серпень",title:"Перший переворот",text:"Президента Ібрагіма Бубакара Кейта усувають на тлі протестів проти корупції та невдач у війні з джихадистами."},{year:"2021, травень",title:"Другий, внутрішній переворот",text:"Ассімі Гойта усуває цивільних керівників перехідного періоду й очолює країну одноосібно."},{year:"2021, грудень",title:"Прибуття «Вагнера»",text:"Хунта запрошує російських найманців замість французьких військ, що остаточно псує стосунки з Парижем."},{year:"2022, березень",title:"Різанина в Мурі",text:"Малійська армія за участю бійців «Вагнера» проводить операцію в селі Мура, звинувачення в масовому вбивстві мирних мешканців розслідує ООН."},{year:"2022",title:"Вихід Франції",text:"Французькі війська завершують виведення операції «Бархан» з Малі; згодом країну залишає і місія ООН MINUSMA."},{year:"2023, листопад",title:"Взяття Кідаля",text:"Малійська армія й «Вагнер» відбивають у туарезьких повстанців місто Кідаль — символічна перемога хунти."},{year:"2024, липень",title:"Засідка під Тінзауатеном",text:"Колону «Вагнера» атакують туарезькі бойовики Фронту звільнення Азаваду разом із джихадистами JNIM біля кордону з Алжиром — одна з найважчих одноразових втрат «Вагнера» в Африці."},{year:"2025",title:"«Вагнер» іде, «Африканський корпус» лишається",text:"Після трьох з половиною років бойових дій «Вагнер» офіційно завершує місію в Малі; підконтрольний Міноборони росії «Африканський корпус» — на 70–80% укомплектований колишніми вагнерівцями — залишається в країні."},{year:"2025, квітень–травень",title:"Партії заборонені, протести розігнані",text:"Рада міністрів ухвалює безстрокову заборону всіх політичних партій; поліція не пускає опозицію на власний з’їзд у Палаці культури Бамако."},{year:"2025, липень",title:"Гойта отримує 5-річний мандат без виборів",text:"Тимчасовий парламент ухвалює закон про поновлюваний 5-річний президентський термін Гойти, що не передбачає проведення виборів узагалі."},{year:"2026, квітень",title:"Скоординовані атаки джихадистів",text:"JNIM і туарезькі повстанці атакують військові об’єкти в Бамако, Гао, Кідалі й Севаре; на боці хунти в боях бере участь «Африканський корпус»."}],slides:[{title:"Два перевороти за дев’ять місяців",text:"Серпень 2020-го й травень 2021-го — армія двічі змінює владу, і обидва рази в центрі подій опиняється Ассімі Гойта.",stat:"2020 → 2021"},{title:"Прощання з «Барханом»",text:"У грудні 2021-го в країні з’являється «Вагнер». Через кілька місяців Франція оголошує про виведення багаторічної військової операції.",stat:"Грудень 2021"},{title:"Мура: розслідування триває",text:"Березнева операція 2022 року в центральному Малі стала однією з найгучніших звинувачень проти «Вагнера» на континенті."},{title:"Тінзауатен",text:"Липень 2024-го: засідка на кордоні з Алжиром коштувала «Вагнеру» десятків загиблих бійців — і показала межі його можливостей у пустелі.",stat:"Липень 2024"},{title:"Золото замість франка",text:"Малі — один з провідних виробників золота в Африці; контроль над видобувною галуззю — важлива частина торгу хунти з новими й старими партнерами."},{title:"Державна структура замість приватної армії",text:"У 2025 році «Вагнер» офіційно передає естафету «Африканському корпусу» — вже не приватній компанії, а формуванню під прямим контролем Міноборони росії."}]},{id:"burkina",name:"Буркіна-Фасо",flagKey:"burkina",capital:"Уагадугу",population:"≈ 23,8 млн (2025)",area:"274 200 км²",independence:"1960, від Франції",language:"французька (офіційна), мооре — найпоширеніша розмовна",compare:{coups:"2 — січень і вересень 2022 (Даміба, потім Траоре)",corps:"Січень 2024",resources:"Золото — третій за обсягом виробник в Африці (94 тонни у 2025-му, рекордний рік); головне джерело бюджетних надходжень, частину копалень націоналізовано",security:"JNIM та ІД «Сахель», за різними оцінками, контролюють від третини до двох третин території; за Глобальним індексом тероризму країна — епіцентр тероризму у світі; десятки міст в облозі, мільйони цивільних постраждали",delays:"Вибори липня 2024-го — обіцяні на 21-місячний перехід — національний діалог у травні 2024-го одразу переніс до 2029 року; виборчу комісію розпущено в липні 2025-го",parties:"Партії заборонили брати участь у публічній діяльності одразу після перевороту 2022-го, а 29 січня 2026-го указом розпустили остаточно — з передачею активів державі",opposition:"У квітні 2025-го Траоре заявив, що країна «більше не в демократії»; за оцінкою CIVICUS, критиків, журналістів і навіть військових примусово мобілізують на фронт проти джихадистів"},intro:["Буркіна-Фасо пережила два перевороти впродовж одного 2022 року. У січні підполковник Поль-Анрі Сандаого Даміба усунув президента Роша Каборе, звинувативши уряд у нездатності зупинити джихадистський наступ — на той момент держава фактично не контролювала значну частину території країни.","Але вже у вересні того ж року капітан Ібрагім Траоре, якому було лише 34 роки, скинув самого Дамібу, заявивши, що той не впорався із завданням і надто тісно пов’язаний із Францією. Траоре став наймолодшим на той момент главою держави в Африці."],order:["Траоре править указами, вибори відкладені: у травні 2024 року перехідний період продовжили ще на п’ять років, орієнтовно до 2029-го, а виборчу комісію розпустили в липні 2025-го. 29 січня 2026 року указом розпущено й самі політичні партії, їхні активи передано державі. Опозиційні голоси, журналістів і навіть критично налаштованих військових, за даними правозахисних організацій, під приводом мобілізації відправляють на передову проти джихадистів.","Публічний образ Траоре свідомо будують на паралелях із Тома Санкарою — соціалістичним лідером Буркіна-Фасо 1980-х, символом панафриканізму та антиколоніалізму. Ця риторика — про «повернутий суверенітет» і розрив із колишньою метрополією — добре узгоджується з наративами, які просуває російськ <h2 class="section-title">Чому «Африканський корпус» не зупинив просування</h2>
<p>Формально «Африканський корпус» мав замінити французьких і американських партнерів у боротьбі з джихадистами. На практиці, за оцінками низки аналітичних центрів (Центр по боротьбі з тероризмом Вест-Пойнта, The Sentry, Джорджтаунський університет), зміна вивіски з приватного «Вагнера» на державну структуру Міноборони росії майже не змінила ні методів, ні результату: до 80% особового складу «Африканського корпусу» — ті самі бійці, що воювали під прапором «Вагнера», з тим самим підходом до контрповстанства.</p>
<p>Головна причина — ставка виключно на силові операції без жодної політики щодо цивільного населення. Різанина в Мурі 2022 року стала не винятком, а моделлю: правозахисні організації фіксують десятки подібних епізодів у Малі й Буркіна-Фасо за участю росіян і місцевих армій. За висновками дослідників, кожен такий епізод радше підживлює вербування джихадистів, ніж стримує його, — люди, які втратили родичів від рук «визволителів», йдуть до JNIM чи ISGS не з ідеологічних міркувань, а з помсти або браку інших варіантів.</p>
<p>До цього додається брак досвіду в класичному контрповстанстві: «Африканський корпус» — це передусім охорона режиму, супровід конвоїв і виробництво пропаганди, а не піхота, навчена утримувати сільську територію проти партизанів. Липнева засідка 2024 року під Тінзауатеном, де загін «Вагнера» й малійської армії потрапив у пастку туарезьких повстанців і JNIM, коштувала щонайменше 46 найманців і 24 малійських військових — і оголила межі можливостей структури в пустелі. Війна в Україні та звужені ресурси Кремля після втрати сирійського плацдарму додатково обмежують спроможність нарощувати присутність у регіоні.</p>
<p>Це не означає, що ситуація однозначно погіршилася всюди й одразу. Малійська армія за підтримки «Вагнера» відбила Кідаль у туарезьких повстанців ще 2023 року, а буркінабе влада звітує про повернення контролю приблизно над десятою частиною раніше втраченої території. Але ці локальні успіхи не змінюють загальної картини: Буркіна-Фасо — країна номер один у світі за Глобальним індексом тероризму, а в Малі з вересня 2025-го JNIM утримує паливну блокаду столиці попри присутність росіян. У кількох задокументованих випадках («Ops Con Intelligence», Critical Threats Project) присутність «Африканського корпусу» не просто не зупинила просування джихадистів, а створила додаткові точки напруги — від міжусобиць у лавах місцевих армій до падіння довіри цивільного населення до держави як такої.</p>

<h2 class="section-title">Заява, яка коштувала дипвідносин</h2>
<p>29 липня 2024 року речник Головного управління розвідки Андрій Юсов в етері загальнонаціонального марафону сказав, що бійці отримали від Києва «необхідну інформацію», яка дала змогу провести операцію проти «російських воєнних злочинців», але деталей розкривати не став. Того самого періоду ГУР передало виданню Kyiv Post ексклюзивне фото туарезьких бійців з українським прапором; згодом з’ясувалося, що знімок зробили за місяць до бою, тобто прямим доказом причетності до конкретної операції він не був.</p>
<p>Слова Юсова прозвучали як натяк, а не як офіційне визнання операції, але для урядів Малі й Нігеру цього виявилося достатньо.</p>
</div>
<div class="section">
<h2 class="section-title">Дипломатичний обвал</h2>
<p>4 серпня 2024 року Малі оголосило про негайний розрив дипломатичних відносин з Україною, назвавши підтримку Києва «підтримкою міжнародного тероризму» й проявом ширшої закономірності, коли «певні актори» використовують проти Малі терористичні угруповання. Через два дні, 6 серпня, у «повній солідарності» з Бамако розірвав відносини й Нігер, закликавши розглянути дії Києва в Раді Безпеки ООН як «українську агресію». Буркіна-Фасо офіційних дипвідносин з Україною на той момент практично не мала, тому просто приєдналася до засудження в межах Альянсу держав Сахелю. У серпні того ж року всі три країни направили до Ради Безпеки ООН спільний лист зі звинуваченням України у «відкритій і визнаній підтримці міжнародного тероризму» в Сахелі, а у квітні 2025-го підписали разом із росією спільну декларацію, яка засуджує «злочинну змову» Києва з джихадистами.</p>
<p>МЗС України заявило, що категорично відкидає звинувачення в постачанні безпілотників повстанцям, і розкритикувало рішення Малі. Прямого офіційного визнання військової операції Київ так і не дав — лише той самий двозначний коментар Юсова.</p>
</div>
<div class="section">
<h2 class="section-title">Зброя, тактика — і суперечливі свідчення</h2>
<p>У листопаді 2024 року чотири туарезькі збройні групи оголосили про об’єднання у Фронт визволення Азаваду (FLA). За матеріалами Reuters, The Arab Weekly та Kyiv Post, повстанці FLA дедалі активніше застосовують тактики, які асоціюють з українським досвідом війни проти росії, — вибухові дрони-камікадзе та надувні макети техніки для введення противника в оману. Речник FLA Мохамед Ельмаулуд Рамадан пояснював тяжіння до Києва спільною долею: і туареги, і українці, за його словами, потерпають від «російського варварства й імперіалізму».</p>
<p>Але тут-таки й з’являється суперечність. Заступник секретаря CSP-DPA із зовнішніх зв’язків Аттає Аг Мохамед у розмові з французькими медіа підтвердив «давні й різносторонні стосунки» з Києвом, включно з обміном розвідінформацією. А вже у вересні 2024-го речник FLA (структури, що виникла з тих-таки туарезьких груп) сказав Reuters, що бій під Тінзауатеном обійшовся зовсім без зовнішньої допомоги — ні фінансової, ні якоїсь іншої, і не від Києва зокрема. Хто з речників ближче до істини — встановити ззовні неможливо: обидва представляють одну й ту саму мережу туарезьких рухів, але дають протилежні відповіді на те саме запитання.</p>
<div class="notebox">
<h4>Що лишається непідтвердженим</h4>
<p>Окремі проросійські джерела та офіційний акаунт Альянсу держав Сахелю у соцмережах поширювали ще й твердження про нібито причетність Польщі до підготовки туарезьких бійців на своїй території. Незалежного підтвердження цього немає — джерело цих тверджень одне й те саме коло акторів, зацікавлених у максимальному роздмухуванні «українського сліду».</p>
</div>
</div>
<div class="section">
<h2 class="section-title">Чому це важливо для сюжету сайту</h2>
<p>Хай би що насправді стояло за словами Юсова, епізод показує: війна росії проти України вже давно не обмежена європейським театром і б’є рикошетом навіть у пісках північного Малі. Розгром під Тінзауатеном — репутаційний удар по «Вагнеру» напередодні його офіційної трансформації в «Африканський корпус» — і, за оцінками аналітиків, один з чинників, які згодом підживили внутрішню недовіру між малійськими військовими та росіянами, що зрештою відлунює й у паливній кризі 2025–2026 років, описаній у розділі про джихадистську загрозу.</p>
</div>

<h2 class="section-title">Малі: рік перетягування каната з Barrick</h2>
<p>Найбільший золотий актив Малі — комплекс Лулу-Гункото канадської Barrick — став головним полем бою нової гірничої політики. У січні 2025 року держава заблокувала експорт і вилучила кілька тонн золота, звинувативши компанію в несплаті податків за старими, «невигідними» угодами. У червні суд передав рудник під тимчасове державне управління на чолі з колишнім міністром охорони здоров’я Зуманою Макаджі.</p>
<p>Після дев’яти місяців фактичного простою сторони домовилися: у листопаді 2025-го Barrick погодилася на виплату близько $430 млн, а в лютому 2026-го отримала оновлену на 10 років ліцензію — держава зберігає 20% через SOMILO. Паралельно у вересні 2025-го уряд затвердив нові угоди за оновленим гірничим кодексом з Allied Gold, B2Gold, Resolute Mining та литієвим проєктом Ganfeng — усюди з більшою державною часткою й пріоритетним доступом до дивідендів.</p>
</div>
<div class="section">
<h2 class="section-title">Буркіна-Фасо: від сировини до власного афінажу</h2>
<p>У червні 2025 року держава націоналізувала копальні Бунгу й Вагньйон, передавши їх новоствореній держкомпанії SOPAMIB. За офіційними даними уряду, з 2022 року золотовидобуток приніс країні близько $18 млрд доходу — цифра, яку влада подає як доказ успіху економічної політики, хоч незалежні аналітики застерігають, що без прозорого нагляду такі надходження ризикують бути погано розподіленими.</p>
<p>Паралельно будується перший національний афінажний завод «Raffinor» потужністю близько 150 тонн золота на рік — щоб країна перестала експортувати необроблену сировину. Станом на середину 2026 року завод ще добудовується, запуск очікують до кінця року. У 2025-му Буркіна-Фасо зафіксувала рекордний видобуток у 94 тонни.</p>
</div>
<div class="section">
<h2 class="section-title">Нігер: розлучення з Orano</h2>
<p>Уран десятиліттями був головним активом Нігеру у відносинах із Францією: через компанію Orano (колишня Areva) країна забезпечувала понад чверть постачання урану до ЄС. Після перевороту 2023 року стосунки посипались: у червні 2024-го відкликано ліцензію на родовище Імурарен, а наприкінці року Orano втратила операційний контроль над своїм головним активом — рудником Somaïr.</p>
<p>У червні 2025 року влада оголосила про повну націоналізацію Somaïr; Orano назвала це незаконною експропріацією і подала позов до міжнародного арбітражу (ICSID), який навіть заборонив продаж видобутого урану без згоди компанії. Утім, у листопаді 2025-го Нігер здійснив відвантаження партії урану всупереч цій забороні, а президент Чіані заявив, що продаватиме уран напряму на світовому ринку. У травні 2026-го уряд анулював саму концесію на родовище Арліт і створив нову державну структуру TSUMCO. У вересні 2025-го міністр гірничої справи Нігеру публічно запропонував росії долучитися до розробки родовищ — поки що це радше сигнал намірів, ніж укладена угода.</p>
</div>

<h4>Нюанс, який часто випускають</h4>
<p>Поширене припущення, що «Вагнер» скрізь виторговує собі копальні в обмін на військову підтримку, підтверджується не всюди однаково. У Центральноафриканській Республіці це справді так: пов’язана з Пригожиним компанія Midas отримала пільговий доступ до золотого родовища Ндассіма вартістю понад мільярд доларів. А от у Малі, за розслідуванням The Sentry, «Вагнер» так і не домігся власних гірничих концесій — натомість його щомісячний гонорар (за оцінками, близько $10,8 млн) фінансувався з держбюджету, куди значною мірою надходили податки тих-таки західних гірничих компаній — Barrick, B2Gold, Resolute й Allied Gold. Тобто частину рахунків за присутність росіян у Малі, за цією версією, оплачували самі західні інвестори.</p>

<p class="map-caption">Схематична карта, не географічна проєкція. Клікни на країну, щоб перейти до її розділу. Підрозділи «Африканського корпусу» зараз присутні у всіх трьох столицях.</p>

</div>
